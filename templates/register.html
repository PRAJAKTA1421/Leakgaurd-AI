{% extends "layout.html" %}
{% block title %}Register - LeakGuard AI{% endblock %}
{% block topbar %}{% endblock %}
{% block content %}
<main class="auth-split">
  <a class="auth-site-brand" href="{{ url_for('home') }}"><span>LG</span>LeakGuard AI</a>
  <section class="split-panel panel-form">
    <div class="panel-brand"><span class="brand-mark">LG</span><span class="brand-name">LeakGuard AI</span></div>
    <div class="panel-copy"><h1>Create your account</h1><p class="panel-subtitle">Start finding hidden subscriptions and saving smarter today.</p></div>
    <form method="post" action="{{ url_for('register') }}" class="auth-form">
      <label><span>Full name</span><input id="name" name="name" type="text" placeholder="Enter your full name" required /></label>
      <label><span>Email</span><input id="email" name="email" type="email" placeholder="Enter your email address" required /></label>
      <label><span>Password</span><input id="password" name="password" type="password" placeholder="Create a password" required /></label>
      <button type="submit" class="btn btn-primary full-width">Create account</button>
    </form>
    <p class="form-footer">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </section>
</main>
{% endblock %}
